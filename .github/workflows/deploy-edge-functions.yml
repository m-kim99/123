name: Deploy Supabase Edge Functions

# 엣지 함수는 Netlify 배포에 포함되지 않는다(Netlify 는 dist/ 만 올린다).
# 지금까지 매번 로컬에서 `supabase functions deploy` 를 수동 실행해야 했고,
# 빠뜨리면 프론트만 새 코드로 나가서 서버와 어긋난 상태가 됐다.
# (예: 2026-08-07 베이직 최소 인원 3인→1인 — UI 는 1인 6,600원을 보여주는데
#  배포 안 된 innopay-payment-confirm 이 금액 불일치로 결제를 거부하는 상태)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:
    inputs:
      functions:
        description: '배포할 함수 이름(공백 구분). 비우면 변경분만 배포.'
        required: false
        type: string

# 배포가 겹치면 나중 것이 먼저 끝나 옛 코드가 남을 수 있다 — 직렬화하고 취소하지 않는다.
concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  verify:
    name: 검증 (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # bun.lock 도 커밋돼 있지만 실제 의존성 트리는 package-lock.json 기준이다.
      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      # payments.test.ts 가 클라이언트와 엣지 함수 3곳의 PLAN_PRICING 일치를 검사한다.
      # 어긋난 채 배포되면 innopay-payment-confirm 이 정상 결제를 거부하므로 여기서 막는다.
      - name: test
        run: npm test

  deploy:
    name: 배포
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 배포 대상 결정
        id: targets
        env:
          MANUAL: ${{ inputs.functions }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL:-}" ]; then
            echo "수동 지정: $MANUAL"
            printf 'list=%s\n' "$MANUAL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # push 이벤트의 이전 커밋. 없거나(수동 실행) 도달 불가면 HEAD~1 로 폴백.
          base="${BEFORE:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "비교 기준: $base"

          changed="$(git diff --name-only "$base" HEAD)"

          # config.toml 의 verify_jwt 는 배포 시점에 적용된다 — 바뀌면 전부 재배포해야
          # 새 게이트가 실제로 반영된다.
          if grep -qx 'supabase/config.toml' <<< "$changed"; then
            echo "config.toml 변경 — 전체 재배포"
            list=""
            for d in supabase/functions/*/; do
              list="$list $(basename "$d")"
            done
          else
            list=""
            while read -r fn; do
              [ -z "$fn" ] && continue
              # 디렉터리가 지워진 함수는 배포 대상이 아니다(삭제는 CLI 로 별도 처리).
              [ -d "supabase/functions/$fn" ] || continue
              list="$list $fn"
            done < <(grep '^supabase/functions/' <<< "$changed" | cut -d/ -f3 | sort -u)
          fi

          list="$(tr -s ' ' <<< "$list" | sed 's/^ //;s/ $//')"
          echo "배포 대상: ${list:-(없음)}"
          printf 'list=%s\n' "$list" >> "$GITHUB_OUTPUT"

      - name: supabase functions deploy
        if: steps.targets.outputs.list != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN 시크릿이 없습니다. 저장소 Settings → Secrets and variables → Actions 에 추가하세요."
            exit 1
          fi

          # 프로젝트 ref 는 이미 저장소에 있다(시크릿 아님).
          ref="$(sed -n 's/^project_id *= *"\(.*\)"/\1/p' supabase/config.toml)"
          [ -n "$ref" ] || { echo "::error::supabase/config.toml 에서 project_id 를 읽지 못했습니다."; exit 1; }
          echo "프로젝트: $ref"

          # verify_jwt 는 config.toml 을 따르므로 플래그를 주지 않는다
          # (과거 --no-verify-jwt 누락으로 결제 콜백이 JWT 게이트로 뒤집힌 사고가 있었다).
          # --use-api: Docker 없이 서버측에서 번들 — 로컬에서 이 경로로 배포 검증함.
          failed=""
          for fn in ${{ steps.targets.outputs.list }}; do
            echo "::group::deploy $fn"
            if supabase functions deploy "$fn" --use-api --project-ref "$ref"; then
              echo "OK $fn"
            else
              echo "::error::배포 실패: $fn"
              failed="$failed $fn"
            fi
            echo "::endgroup::"
          done

          [ -z "$failed" ] || { echo "::error::실패한 함수:$failed"; exit 1; }

      - name: 배포 결과 확인 (ACTIVE 여부)
        if: steps.targets.outputs.list != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ref="$(sed -n 's/^project_id *= *"\(.*\)"/\1/p' supabase/config.toml)"
          listing="$(supabase functions list --project-ref "$ref")"
          echo "$listing"

          bad=""
          for fn in ${{ steps.targets.outputs.list }}; do
            # 표는 `|` 구분이고 NAME=2번째, STATUS=4번째 필드다(로컬 출력으로 확인).
            # 부분일치를 피하려고 트림 후 정확히 비교한다(innopay-noti vs innopay-noti-x).
            if ! awk -F'|' -v f="$fn" '
                   { n=$2; s=$4; gsub(/^[ \t]+|[ \t]+$/,"",n); gsub(/^[ \t]+|[ \t]+$/,"",s) }
                   n == f && s == "ACTIVE" { found=1 }
                   END { exit !found }' <<< "$listing"; then
              bad="$bad $fn"
            fi
          done

          [ -z "$bad" ] || { echo "::error::배포 후 ACTIVE 가 아닌 함수:$bad"; exit 1; }
          echo "전부 ACTIVE"

      - name: 요약
        if: always()
        run: |
          {
            echo "### 엣지 함수 배포"
            echo ""
            if [ -z "${{ steps.targets.outputs.list }}" ]; then
              echo "변경된 함수가 없어 배포하지 않았습니다."
            else
              echo "대상: \`${{ steps.targets.outputs.list }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
